[project]
name = "flydash"
version = "0.1.0"
description = "A FlyWire fruit fly brain plays Geometry Dash"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "flybrain",
  "torch>=2.9",
  "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flydash"]

[tool.uv.sources]
flybrain = { path = "../dino-fly/brain", editable = true }
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
